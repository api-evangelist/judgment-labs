aid: judgment-labs
name: Judgment Labs
description: >-
  Judgment Labs builds the continuous-improvement stack for AI agents: tooling to trace,
  evaluate, monitor, and improve agent behavior in production. Its open-source Judgeval SDK
  (Python and TypeScript, with Go and Java clients) instruments agent frameworks and model
  providers to capture traces, spans, and tool calls; Agent Judges and Code Judges score
  behavior against natural-language rubrics and deterministic checks; and Agent Behavior
  Monitoring plus automations and alerts surface regressions and failure modes. The platform
  is accessed through the Judgeval SDKs, the judgment CLI, and a hosted MCP server, and
  integrates with LangGraph, OpenAI Agents SDK, Claude Agent SDK, Google ADK, Vercel AI SDK,
  LiveKit, Pipecat, and OpenTelemetry / OpenInference tracing pipelines. The company is
  backed by Lightspeed with a $32M round.
